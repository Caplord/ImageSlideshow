# XcodeGen manifest for the example project.
#
# The generated ImageSlideshow.xcodeproj/ is gitignored.
# Regenerate locally with:
#   xcodegen generate && pod install
# (pod install is required after generation — XcodeGen wipes the CocoaPods integration.)
# CI runs the same two commands before building.
name: ImageSlideshow
options:
  deploymentTarget:
    iOS: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    # CocoaPods script phases write into the build dir
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  ImageSlideshow_Example:
    type: application
    platform: iOS
    sources:
      - ImageSlideshow
    settings:
      base:
        INFOPLIST_FILE: ImageSlideshow/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: "org.cocoapods.demo.$(PRODUCT_NAME:rfc1034identifier)"
        DEVELOPMENT_TEAM: 5VWB99DS38
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  ImageSlideshow_Tests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: ImageSlideshow_Example
    settings:
      base:
        INFOPLIST_FILE: Tests/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: "org.cocoapods.$(PRODUCT_NAME:rfc1034identifier)"
        DEVELOPMENT_TEAM: 5VWB99DS38

  ImageSlideshow_framework:
    type: framework
    platform: iOS
    sources:
      - path: ../ImageSlideshow/Classes/Core
      - path: ImageSlideshow_framework
      - path: ../ImageSlideshow/Assets/ic_cross_white@2x.png
        buildPhase: resources
      - path: ../ImageSlideshow/Assets/ic_cross_white@3x.png
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: ImageSlideshow
        PRODUCT_BUNDLE_IDENTIFIER: io.zvo.ImageSlideshow-framework
        INFOPLIST_FILE: ImageSlideshow_framework/Info.plist
        DEVELOPMENT_TEAM: 9X4J83EL7M
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        CURRENT_PROJECT_VERSION: 1
        VERSIONING_SYSTEM: apple-generic

schemes:
  ImageSlideshow-Example:
    build:
      targets:
        ImageSlideshow_Example: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ImageSlideshow_Tests
    profile:
      config: Release
    archive:
      config: Release

  ImageSlideshow_framework:
    build:
      targets:
        ImageSlideshow_framework: all
    run:
      config: Debug
