# XcodeGen manifest for the example project.
#
# The generated ImageSlideshow.xcodeproj/ is gitignored.
# Regenerate locally with:
#   xcodegen generate
# (ImageSlideshow is consumed as a local Swift package, so no separate
# dependency-install step is needed.)
# CI runs the same command before building.
name: ImageSlideshow
options:
  deploymentTarget:
    iOS: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.0"

packages:
  ImageSlideshow:
    path: ../

targets:
  ImageSlideshow_Example:
    type: application
    platform: iOS
    sources:
      - ImageSlideshow
    dependencies:
      - package: ImageSlideshow
        product: ImageSlideshow
      - package: ImageSlideshow
        product: ImageSlideshowAlamofire
      - package: ImageSlideshow
        product: ImageSlideshowSDWebImage
      - package: ImageSlideshow
        product: ImageSlideshowKingfisher
    settings:
      base:
        INFOPLIST_FILE: ImageSlideshow/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: "org.cocoapods.demo.$(PRODUCT_NAME:rfc1034identifier)"
        DEVELOPMENT_TEAM: 5VWB99DS38
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  ImageSlideshow_Tests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: ImageSlideshow_Example
    settings:
      base:
        INFOPLIST_FILE: Tests/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: "org.cocoapods.$(PRODUCT_NAME:rfc1034identifier)"
        DEVELOPMENT_TEAM: 5VWB99DS38

schemes:
  ImageSlideshow-Example:
    build:
      targets:
        ImageSlideshow_Example: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ImageSlideshow_Tests
    profile:
      config: Release
    archive:
      config: Release
